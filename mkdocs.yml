site_name: 作品集
site_url: https://riley192.github.io/hard-groove/
theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  favicon: assets/archive-edit-outline.png
  icon:
    logo: material/archive-edit-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
extra:
  analytics:
    provider: custom
exclude_docs: |
  .obsidian
  .obsidian/*
nav:
  - 首页: index.md
  - 某记账软件帮助中心:
    - 项目首页: example-bookkeeping-app/index.md
    - English Home: example-bookkeeping-app/index en.md
    - 快速上手:
      - 第一次记账：从安装到记下第一笔: example-bookkeeping-app/quickstart/quick start first-record.md
    - 操作指南:
      - 记录一笔支出: example-bookkeeping-app/how-to guides/add-expense.md
      - 设置分类月度预算: example-bookkeeping-app/how-to guides/set-budget.md
      - 导出账单（CSV / Excel / PDF）: example-bookkeeping-app/how-to guides/export-bills.md
      - 多设备同步: example-bookkeeping-app/how-to guides/sync-devices.md
      - 删除账号: example-bookkeeping-app/how-to guides/delete-account.md
    - 排障:
      - 同步失败怎么办: example-bookkeeping-app/troubleshooting/sync-failed.md
      - 导出失败怎么办: example-bookkeeping-app/troubleshooting/export-failed.md
    - 概念解释:
      - 为什么要做预算: example-bookkeeping-app/explanation/why-budget.md
      - 云同步是怎么工作的: example-bookkeeping-app/explanation/how-sync-works.md
    - 参考:
      - 平台与系统要求: example-bookkeeping-app/reference/system-requirements.md
      - 导出格式说明: example-bookkeeping-app/reference/export-formats.md
      - 支出类别列表: example-bookkeeping-app/reference/expense-categories.md
      - 错误信息一览: example-bookkeeping-app/reference/error-messages.md
    - 更新日志:
      - v2.0: example-bookkeeping-app/release notes/release notes v2.0.md
    - 反馈与支持: example-bookkeeping-app/support.md
  - 屠宰废水厂工艺文档包:
    - 项目说明: example-wastewater-docs/index.md
    - 一座屠宰废水处理厂是怎么工作的: example-wastewater-docs/docs1.md
    - 叠螺式污泥脱水机操作规程: example-wastewater-docs/docs2.md
    - 设计参数速查表: example-wastewater-docs/docs3.md
    - 出水水质异常排查表: example-wastewater-docs/docs4.md
  - 工程图纸选集:
    - 选集说明: drawings/index.md
    - 管线系统图: drawings/piping-systems.md
    - 构筑物工艺图: drawings/structure-process.md
    - 工艺流程图: drawings/process-flow.md